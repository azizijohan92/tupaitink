let data=readLocal();
let ui={screen:data.profiles.length?'home':'welcome',world:0,game:null,modal:null,age:'3-4',avatar:'🦊',newName:'',gateAnswer:0,breakShown:false,sessionStarted:Date.now(),gameStart:0,fb:null};

function persist(){try{localStorage.setItem(STORE_KEY,JSON.stringify(data))}catch(e){console.warn('Unable to save locally',e)}}
function profile(){return data.profiles.find(p=>p.id===data.active)||null}
function sessions(p=profile()){return data.sessions.filter(s=>p&&s.childId===p.id)}
function pName(p){return p?h(p.name):'Tupi'}
function ageLevel(){let a=profile()?.age||'3-4';return a==='3-4'?1:a==='4-5'?2:3}
function gameObj(id){return CATALOG.find(g=>g.id===id)}
function progress(id,p=profile()){return p?.progress?.[id]||{plays:0,stars:0,level:ageLevel()}}
function worldComplete(idx,p=profile()){return CATALOG.filter(g=>g.world===idx&&progress(g.id,p).plays>0).length}
function allStars(p=profile()){return Object.values(p?.progress||{}).reduce((a,x)=>a+(x.stars||0),0)}
function taught(p=profile()){return Object.values(p?.progress||{}).filter(x=>x.plays>0).length}
function updatedProfile(){let p=profile();if(p)p.updatedAt=Date.now()}
function save(){updatedProfile();persist()}

function titleForScreen(){return ui.screen==='game'?l(gameObj(ui.game?.id)?.name||['Permainan','Game']):ui.screen==='world'?l(W[ui.world].name):ui.screen==='home'?t('home'):ui.screen==='worlds'?t('worlds'):ui.screen==='stickers'?t('stickers'):ui.screen==='parents'?t('parents'):t('settings')}

function welcomeScreen(){return `<div style="max-width:1180px;margin:auto;padding:25px 22px"><div class="brand"><div class="brand-logo">🐿️</div><div><h3>TupaiTink</h3><small>LITTLE MINDS, BIG DISCOVERIES</small></div></div><section class="welcome"><div><span class="eyebrow">✦ ${t('free')}</span><h1>${l(['Minda kecil,','Little minds,'])}<br><span style="color:var(--green)">${l(['penemuan besar.','big discoveries.'])}</span></h1><p class="muted" style="font-size:1.12rem">${l(['Temani Tupi meneroka 6 dunia dan 24 permainan untuk kanak-kanak berumur 3–6 tahun.','Join Tupi across 6 learning worlds and 24 playful games for ages 3–6.'])}</p><div class="badge-row"><span class="pill">🌱 3–6 ${t('years')}</span><span class="pill">🎮 24 ${t('games')}</span><span class="pill">🔒 ${l(['Privasi diutamakan','Privacy-first'])}</span></div><button class="btn primary" onclick="TT.openCreate()">${t('created')} →</button> <button class="btn white" onclick="TT.switchLang()">🌐 ${data.lang==='ms'?'English':'Bahasa Melayu'}</button><p class="small muted mt">${l(['Mod demo setempat — tiada akaun atau bayaran diperlukan.','Local demo mode — no account or payment needed.'])}</p></div><div class="welcome-visual">${tupiSVG()}<div class="pill" style="position:absolute;top:27px;left:20px">💛 Play • Learn • Grow</div></div></section></div>`}

function chartDays(n){let a=[];for(let i=n-1;i>=0;i--){let d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);let start=d.getTime();a.push(sessions().filter(s=>s.completedAt>=start&&s.completedAt<start+86400000).length)}return a}

function makeOptions(correct,n=3,min=1,max=12){let arr=[correct];while(arr.length<n){let candidate=min+rnd(max-min+1);if(!arr.includes(candidate))arr.push(candidate)}return shuffle(arr)}
function sampleDifferent(n,exclude=[]){return shuffle(EMOJI.filter(x=>!exclude.includes(x))).slice(0,n)}
function makeQuestion(id,level,round){let n=level,arr,correct,idx,target;
 switch(id){
 case 'pairs':{let things=sampleDifferent(n+2);arr=shuffle(things.flatMap((s,i)=>[{key:i,emoji:s,open:false,matched:false},{key:i,emoji:s,open:false,matched:false}]));return {cards:arr,first:null,pairsLeft:things.length,prompt:['Cari semua pasangan gambar yang sama.','Find all the matching pictures.']}}
 case 'sequence':case 'follow':{let symbols=id==='follow'?['⬆️','⬇️','⬅️','➡️']:sampleDifferent(4);arr=Array.from({length:n+2},()=>pick(symbols));return {seq:arr,symbols:shuffle(symbols),input:[],prompt:id==='follow'?['Ingat arah pergerakan Tupi.','Remember Tupi’s directions.']:['Ingat turutan gambar.','Remember the picture sequence.']}}
 case 'missing':{arr=sampleDifferent(n+3);idx=rnd(arr.length);target=arr[idx];return {items:arr,missing:target,choices:shuffle([target,...sampleDifferent(2+Math.min(n,2),arr)]),prompt:['Ingat semua gambar, kemudian cari yang hilang.','Memorize the pictures, then find what is missing.']}}

 return `<div class="game-shell">${header}<div class="game-area">${steps}<div class="game-mascot">${tupiSVG('small')}<div class="speech">${h(l(g.q?.prompt||entry.desc))}</div></div>${g.hintMsg?`<div class="notice" style="max-width:600px;margin:auto">💡 ${h(g.hintMsg)}</div>`:''}${g.error?`<div class="notice warn" role="status" style="max-width:600px;margin:14px auto">${h(g.error)}</div>`:''}${gameBoard(g)}<div class="flex" style="justify-content:center;margin-top:22px"><button class="btn small pale" onclick="TT.speakQuestion()">🔊 ${t('replay')}</button><button class="btn small pale" onclick="TT.hint()">💡 ${t('hint')}</button><button class="btn small ghost" onclick="TT.skipRound()">↪ ${t('skipRound')}</button></div></div></div>`;
}
function finishScreen(g,entry){let star=g.stars||1;return `<div class="game-shell"><div class="game-area" style="padding:46px 18px"><span class="eyebrow">🏅 ${t('done')}</span><div style="font-size:4rem;margin:16px 0">🎉 🐿️ 🎉</div><h1>${t('finish')}</h1><p class="muted">${t('good')}</p><div style="font-size:2.7rem;letter-spacing:10px;margin:15px 0">${'⭐'.repeat(star)}</div><div class="stats" style="max-width:540px;margin:25px auto"><div class="stat"><strong>${g.correct}/${g.maxRounds}</strong><span>${t('round')}</span></div><div class="stat"><strong>${g.level}</strong><span>${t('level')}</span></div><div class="stat"><strong>${g.hints}</strong><span>${t('hint')}</span></div></div><div class="flex" style="justify-content:center"><button class="btn primary" onclick="TT.start('${entry.id}')">🔁 ${t('playAgain')}</button><button class="btn pale" onclick="TT.openWorld(${entry.world})">${t('worlds')} →</button><button class="btn pale" onclick="TT.go('stickers')">🌟 ${t('stickers')}</button></div><p class="tiny muted mt">${t('review')}</p></div></div>`}
function playVoice(text){if(!data.sound||!('speechSynthesis'in window))return;try{window.speechSynthesis.cancel();let utter=new SpeechSynthesisUtterance(String(text).replace(/\p{Extended_Pictographic}/gu,'').trim());utter.lang=data.lang==='ms'?'ms-MY':'en-US';utter.rate=.82;utter.pitch=1.1;utter.volume=data.voiceVolume??.9;let voices=window.speechSynthesis.getVoices();let lang=utter.lang.slice(0,2);let voice=voices.find(v=>v.lang.toLowerCase().startsWith(lang));if(voice)utter.voice=voice;window.speechSynthesis.speak(utter)}catch(e){console.warn('Speech unavailable',e)}}
function beginRound(){let g=ui.game;if(!g)return;g.q=makeQuestion(g.id,g.level,g.round);g.phase=['sequence','follow','missing'].includes(g.id)?'observe':'play';g.error='';g.hintMsg='';g.hintedThisRound=false;g.roundMistakes=0;render()}
function wrong(){let g=ui.game;if(!g)return;g.attempts++;g.roundMistakes++;g.goodStreak=0;g.badStreak++;g.error=t('incorrect');if(g.badStreak>=3&&g.level>1){g.level--;g.badStreak=0;g.hintMsg=l(['Kita cuba dengan tahap yang lebih santai.','Let’s try a gentler level.'])}render()}
function completeRound(){let g=ui.game;if(!g||g.phase==='feedback')return;g.attempts++;g.correct++;if(g.roundMistakes===0&&!g.hintedThisRound){g.goodStreak++;g.badStreak=0}else{g.goodStreak=0}if(g.goodStreak>=2&&g.level<3){g.level++;g.goodStreak=0}g.phase='feedback';g.error='';render();playVoice(t('correct'))}
function endGame(){let g=ui.game;if(!g||g.logged)return;g.logged=true;let p=profile();if(!p){ui.screen='home';render();return}let pg=progress(g.id,p);let stars=g.correct===0?1:g.correct===g.maxRounds&&g.hints<=1&&g.attempts<=g.maxRounds*2?3:g.correct>=Math.ceil(g.maxRounds*.6)?2:1;g.stars=stars;let record={id:uid(),childId:p.id,gameId:g.id,worldId:gameObj(g.id).world,startedAt:g.startedAt,completedAt:Date.now(),durationSeconds:Math.max(1,Math.round((Date.now()-g.startedAt)/1000)),rounds:g.maxRounds,correctResponses:g.correct,attempts:g.attempts,hintsUsed:g.hints,level:g.level,stars};data.sessions.push(record);if(data.sessions.length>1200)data.sessions.splice(0,data.sessions.length-1200);p.progress||={};p.progress[g.id]={plays:(pg.plays||0)+1,stars:Math.max(pg.stars||0,stars),level:g.level,lastPlayed:Date.now()};g.phase='finish';save();if(cloudUser)void cloudSync().catch(e=>{cloudError=e.message});if(Date.now()-ui.sessionStarted>=data.breakMinutes*60000&&!ui.breakShown){ui.breakShown=true;setTimeout(()=>{ui.modal='break';renderModal()},1300)}render()}
function checkCorrectChoice(i){let g=ui.game,q=g?.q;if(!q||g.phase!=='play')return false;let correct;
 if(['find','difference','listen','stopgo','cause','count','numbermatch','compare','storymath','shadow','storyquiz','next','odd'].includes(g.id)){correct=i===q.idx}
 else if(g.id==='missing'||g.id==='pattern'){correct=(g.id==='missing'?q.choices[i]===q.missing:q.options[i]===q.target)}
 else if(g.id==='location'){correct=q.dirs[i]===q.direction}
 else correct=false;
 if(correct)completeRound();else wrong();return correct}
const FIRESTORE_RULES=`rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    function isOwner(uid) {
      return request.auth != null && request.auth.uid == uid;
    }
    match /users/{uid} {
      allow read, write: if isOwner(uid);
      match /children/{childId} {
        allow read, write: if isOwner(uid);
        match /sessions/{sessionId} {
          allow read, write: if isOwner(uid);
        }
        match /progress/{gameId} {
          allow read, write: if isOwner(uid);
        }
        match /achievements/{achievementId} {
          allow read, write: if isOwner(uid);
        }
      }
    }
  }
}`;
let cloudModules=null;
async function initFirebase(){if(cloudModules)return cloudModules;let [app,auth,firestore]=await Promise.all([import('https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js'),import('https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js'),import('https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js')]);let fa=app.initializeApp(FIREBASE_CONFIG),au=auth.getAuth(fa),db=firestore.getFirestore(fa);cloudModules={auth,firestore,au,db};firebase=fa;return cloudModules}
async function cloudSync(){if(!cloudUser||cloudBusy)return;cloudBusy=true;cloudError='';try{let m=await initFirebase(),{firestore:f,db}=m,uid=cloudUser.uid;let remote=await f.getDocs(f.collection(db,'users',uid,'children'));
 for(let docSnap of remote.docs){let rp=docSnap.data(),local=data.profiles.find(p=>p.id===docSnap.id);if(!local){data.profiles.push({...rp,id:docSnap.id})}else if((rp.updatedAt||0)>(local.updatedAt||0)){Object.assign(local,rp)}let items=await f.getDocs(f.collection(db,'users',uid,'children',docSnap.id,'sessions'));for(let s of items.docs){if(!data.sessions.some(x=>x.id===s.id))data.sessions.push({...s.data(),id:s.id})}}
 if(!data.active&&data.profiles.length)data.active=data.profiles[0].id;persist();
 await f.setDoc(f.doc(db,'users',uid),{email:cloudUser.email,lang:data.lang,updatedAt:Date.now()},{merge:true});
 for(let p of data.profiles){await f.setDoc(f.doc(db,'users',uid,'children',p.id),{id:p.id,name:p.name,avatar:p.avatar,age:p.age,progress:p.progress||{},updatedAt:p.updatedAt||Date.now()},{merge:true});let childSessions=data.sessions.filter(s=>s.childId===p.id).slice(-250);for(let s of childSessions)await f.setDoc(f.doc(db,'users',uid,'children',p.id,'sessions',s.id),s,{merge:true})}
 toast(l(['Penyegerakan Firebase selesai.','Firebase sync complete.']));
 }catch(e){cloudError=e?.message||'Firebase sync failed';toast(cloudError)}finally{cloudBusy=false;render()}}
const TT={
 go(screen){if(['parents','settings'].includes(screen)&&!ui.parentUnlocked){ui.gateTarget=screen;ui.gateA=9+rnd(10);ui.gateB=7+rnd(10);ui.modal='gate';renderModal();return}ui.screen=screen;ui.modal=null;render();window.scrollTo(0,0)},
 openWorld(i){ui.world=i;ui.screen='world';ui.modal=null;render();window.scrollTo(0,0)},
 randomGame(){this.start(pick(CATALOG).id)},
 switchLang(){data.lang=data.lang==='ms'?'en':'ms';persist();render()},
 start(id){if(!profile()){this.openCreate();return}ui.game={id,level:profile()?.preferredLevel&&profile().preferredLevel!=='auto'?Number(profile().preferredLevel):clamp(progress(id).level||ageLevel(),1,3),round:0,maxRounds:5,correct:0,attempts:0,hints:0,goodStreak:0,badStreak:0,startedAt:Date.now(),phase:'tutorial',logged:false};ui.screen='game';ui.modal=null;render();window.scrollTo(0,0)},
 begin(){beginRound();this.speakQuestion()},
 ready(){if(ui.game?.phase==='observe'){ui.game.phase='play';ui.game.error='';render();this.speakQuestion()}},
 advance(){let g=ui.game;if(!g||g.phase!=='feedback')return;if(g.round+1>=g.maxRounds){endGame()}else{g.round++;beginRound()}},
 answer(i){checkCorrectChoice(i)},
 pair(i){let g=ui.game,q=g?.q;if(!q||g.phase!=='play'||q.busy)return;let card=q.cards[i];if(card.open||card.matched)return;card.open=true;if(q.first===null){q.first=i;render();return}let prev=q.cards[q.first];q.busy=true;if(prev.key===card.key){prev.matched=true;card.matched=true;q.pairsLeft--;q.first=null;q.busy=false;g.attempts++;if(q.pairsLeft===0){completeRound()}else render()}else{wrong();setTimeout(()=>{if(ui.game!==g||g.q!==q||g.phase!=='play')return;prev.open=false;card.open=false;q.first=null;q.busy=false;render()},850)}},
 seq(i){let g=ui.game,q=g?.q;if(!q||g.phase!=='play')return;let next=q.symbols[i],step=q.input.length;if(next===q.seq[step]){q.input.push(next);if(q.input.length===q.seq.length)completeRound();else render()}else{q.input=[];wrong()}},
 sort(i){let g=ui.game,q=g?.q;if(!q||g.phase!=='play')return;if(q.keys[i]===q.tasks[q.current].group){q.current++;if(q.current>=q.tasks.length)completeRound();else render()}else wrong()},
 place(i){let g=ui.game,q=g?.q;if(!q||g.phase!=='play')return;if(q.options[i]===q.steps[q.current]){q.current++;if(q.current===q.steps.length)completeRound();else render()}else wrong()},
 tile(i){let g=ui.game,q=g?.q;if(!q||g.phase!=='play')return;if(q.selected===null){q.selected=i;render();return}if(q.selected===i){q.selected=null;render();return}let x=q.selected;[q.pieces[x],q.pieces[i]]=[q.pieces[i],q.pieces[x]];q.selected=null;if(q.pieces.every((p,j)=>p===j))completeRound();else render()},
 story(i){let g=ui.game,q=g?.q;if(!q||g.phase!=='play')return;let item=q.items[i];if(q.chosen.includes(item.id))return;if(item.id===q.chosen.length){q.chosen.push(item.id);if(q.chosen.length===q.items.length)completeRound();else render()}else wrong()},
 sortSwitch(i){let g=ui.game,q=g?.q;if(!q||g.phase!=='play')return;let actual=q.tasks[q.current][q.rule],selected=(q.rule==='color'?q.colors:q.shapes)[i];if(actual===selected){q.current++;if(q.current>=q.tasks.length)completeRound();else{if(q.current===q.switchAt){q.rule='shape';g.hintMsg=l(['Sekarang tukar! Kumpulkan mengikut BENTUK.','Switch! Now sort by SHAPE.']);playVoice(g.hintMsg)}render()}}else wrong()},
 hint(){let g=ui.game,q=g?.q;if(!q||!['play','observe'].includes(g.phase))return;g.hints++;g.hintedThisRound=true;let msg;
 if(g.id==='pairs'){let card=q.cards.find(c=>!c.matched);msg=l([`Cari satu lagi kad dengan gambar ${card?.emoji}.`,`Look for another card with ${card?.emoji}.`])}
 else if(['sequence','follow'].includes(g.id)){msg=l([`Turutan bermula dengan ${q.seq[0]}.`,`The sequence begins with ${q.seq[0]}.`])}
 else if(g.id==='missing'){msg=l([`Cuba ingat gambar ${q.missing}.`,`Try to remember the ${q.missing} picture.`])}
 else if(g.id==='puzzle'){msg=l(['Tengok gambar contoh dan cuba susun kepingan sudut dahulu.','Look at the reference image and try matching the corners first.'])}
 else if(g.id==='sort'){msg=l([`Gambar ${q.tasks[q.current].emoji} tergolong dalam kumpulan ${GROUP_LABEL[q.tasks[q.current].group][0]}.`,`The ${q.tasks[q.current].emoji} belongs in ${GROUP_LABEL[q.tasks[q.current].group][1]}.`])}
 else if(g.id==='shape'){msg=l([`Cari bentuk ${q.steps[q.current]}.`,`Find the ${q.steps[q.current]}.`])}
 else if(g.id==='switch'){msg=l([`Perhatikan ${q.rule==='color'?'warna':'bentuk'} gambar.`,`Look at the item's ${q.rule==='color'?'colour':'shape'}.`])}
 else if(g.id==='storyorder'){let next=q.items.find(x=>x.id===q.chosen.length);msg=l([`Seterusnya: ${next?.label[0]}.`,`Next: ${next?.label[1]}.`])}
 else if(g.id==='count'){msg=l(['Kira satu demi satu sambil tunjuk setiap haiwan.','Count slowly, pointing to one animal at a time.'])}
 else if(g.id==='pattern'){msg=l(['Cuba cari gambar yang berulang dalam corak.','Look for the pictures that repeat in the pattern.'])}
 else if(g.id==='stopgo'){msg=l(['Baca peraturan dahulu. Warna boleh bertukar peranan!','Read the rule first. Colours can swap their roles!'])}
 else msg=l(['Lihat gambar dan arahan dengan teliti. Cuba satu persatu.','Look closely at the pictures and instructions. Try one step at a time.']);g.hintMsg=msg;render();playVoice(msg)},
 skipRound(){let g=ui.game;if(!g||!['play','observe'].includes(g.phase))return;if(g.round+1>=g.maxRounds){endGame()}else{g.round++;g.goodStreak=0;beginRound()}},
 speakQuestion(){let g=ui.game;if(g?.q)playVoice(speakingText(g.q,g))},
 openCreate(){if(data.profiles.length&&!ui.parentUnlocked){ui.gateTarget='create';ui.gateA=9+rnd(10);ui.gateB=7+rnd(10);ui.modal='gate';renderModal();return}ui.age='3-4';ui.avatar='🦊';ui.modal='create';renderModal()},
 setAge(x){ui.age=x;let v=document.getElementById('childName')?.value||'';renderModal();let el=document.getElementById('childName');if(el)el.value=v},
 setAvatar(x){ui.avatar=x;let input=document.getElementById('childName'),v=input?.value||'';renderModal();let el=document.getElementById('childName');if(el)el.value=v},
 submitProfile(event){event.preventDefault();let input=document.getElementById('childName');let name=input.value.trim();if(!name)return;let consent=document.getElementById('consentCheck');if(!data.consent&&consent&&!consent.checked)return;data.consent=true;let p={id:uid(),name:name.slice(0,24),avatar:ui.avatar,age:ui.age,preferredLevel:'auto',progress:{},updatedAt:Date.now()};data.profiles.push(p);data.active=p.id;save();ui.modal=null;ui.screen='home';render();window.scrollTo(0,0);if(cloudUser)void cloudSync()},
 openProfiles(){ui.modal='profiles';renderModal()},
 selectProfile(id){if(!data.profiles.some(p=>p.id===id))return;data.active=id;ui.sessionStarted=Date.now();ui.breakShown=false;persist();ui.modal=null;ui.screen='home';render()},
 closeModal(){ui.modal=null;renderModal()},
 unlock(event){event.preventDefault();let answer=Number(document.getElementById('gateValue')?.value);if(answer!==ui.gateA+ui.gateB){toast(l(['Jawapan belum tepat. Cuba lagi.','Not quite. Try again.']));return}ui.parentUnlocked=true;let target=ui.gateTarget;ui.modal=null;if(target==='create')this.openCreate();else this.go(target)},
 setProfileLevel(v){let p=profile();if(!p)return;p.preferredLevel=v;save();render();toast(l(['Tahap permulaan dikemas kini.','Starting level updated.']))},
 setting(k,v){if(!['sound','reduce','breakMinutes','voiceVolume'].includes(k))return;data[k]=v;persist();render()},
 exportData(){let blob=new Blob([JSON.stringify({app:'TupaiTink',exportedAt:new Date().toISOString(),data},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='TupaiTink-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);toast(l(['Fail data dieksport.','Data exported.']))},
 showPrivacy(){ui.modal='privacy';renderModal()},
 showDelete(){if(!ui.parentUnlocked){ui.gateTarget='parents';ui.gateA=9+rnd(10);ui.gateB=7+rnd(10);ui.modal='gate';renderModal();return}ui.modal='delete';renderModal()},
 async deleteProfile(){let id=data.active;if(!id)return;data.profiles=data.profiles.filter(p=>p.id!==id);data.sessions=data.sessions.filter(s=>s.childId!==id);data.active=data.profiles[0]?.id||null;persist();ui.modal=null;ui.screen=data.profiles.length?'parents':'welcome';render();if(cloudUser){try{let m=await initFirebase(),f=m.firestore,uid=cloudUser.uid;let ss=await f.getDocs(f.collection(m.db,'users',uid,'children',id,'sessions'));for(let s of ss.docs)await f.deleteDoc(s.ref);await f.deleteDoc(f.doc(m.db,'users',uid,'children',id));toast(l(['Profil dipadam.','Profile deleted.']))}catch(e){cloudError=e.message;toast(l(['Dipadam dari peranti; pemadaman awan gagal.','Deleted locally; cloud deletion failed.']))}}},
 showRules(){ui.modal='rules';renderModal()},
 async copyRules(){try{await navigator.clipboard.writeText(FIRESTORE_RULES);toast(l(['Rules disalin!','Rules copied!']))}catch(e){toast(l(['Sila salin secara manual.','Please copy manually.']))}},
 openAuth(){if(cloudUser){void cloudSync();return}ui.modal='auth';renderModal()},
 async authSubmit(event){event.preventDefault();let form=event.currentTarget,mode=event.submitter?.value||'signin',email=form.elements.email.value.trim(),password=form.elements.password.value;toast(l(['Menyambung Firebase…','Connecting to Firebase…']));try{let m=await initFirebase();let result=mode==='signup'?await m.auth.createUserWithEmailAndPassword(m.au,email,password):await m.auth.signInWithEmailAndPassword(m.au,email,password);cloudUser=result.user;ui.modal=null;render();await cloudSync()}catch(e){cloudError=e?.message||'Firebase error';toast(cloudError);renderModal()}},
 async signOut(){try{let m=await initFirebase();await m.auth.signOut(m.au);cloudUser=null;cloudError='';toast(l(['Log keluar berjaya.','Signed out.']));render()}catch(e){toast(e.message)}}
};
